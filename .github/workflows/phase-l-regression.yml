name: Phase L Regression

on:
  push:
    branches:
      - phase-l-regression-failure-testing
  pull_request:
    branches:
      - phase-l-regression-failure-testing

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
