name: Phase O Production Gate

on:
  push:
    branches:
      - phase-o-production-gate
  pull_request:
    branches:
      - phase-o-production-gate

jobs:
  production-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
