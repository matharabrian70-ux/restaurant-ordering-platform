name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "API base URL to smoke-test"
        required: true
        default: "https://restaurant-ordering-api-ow3p.onrender.com"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Run deployed API smoke tests
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
        run: node api/production-smoke.mjs
