name: Security Regression

on:
  push:
    branches:
      - main
      - 'audit/phase*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Install API dependencies
        run: npm install
      - name: Run security regression suite
        run: npm test
