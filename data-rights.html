<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Rights Request</title><link rel="stylesheet" href="styles.css"></head><body><main class="page legal-page"><p class="eyebrow">DATA RIGHTS</p><h1>Submit a Data Rights Request</h1><p>Use this form to request access, rectification, erasure where applicable, objection, restriction or portability. The restaurant may need to verify your identity before fulfilling a request.</p><form id="rights-form"><label>Name<input id="name" required></label><label>Email<input id="email" type="email"></label><label>Phone<input id="phone" type="tel"></label><label>Request type<select id="type"><option>ACCESS</option><option>RECTIFICATION</option><option>ERASURE</option><option>OBJECTION</option><option>RESTRICTION</option><option>PORTABILITY</option></select></label><label>Details<textarea id="details" rows="6"></textarea></label><button class="btn" type="submit">SUBMIT REQUEST</button><p id="result"></p></form></main><script src="compliance-ui.js"></script><script>document.getElementById('rights-form').addEventListener('submit',async e=>{e.preventDefault();const result=document.getElementById('result');try{const businessId=new URLSearchParams(location.search).get('businessId')||'11111111-1111-4111-8111-111111111111';const r=await fetch('https://restaurant-ordering-api-ow3p.onrender.com/api/privacy/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({businessId,requestType:document.getElementById('type').value,name:document.getElementById('name').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,details:document.getElementById('details').value})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Request failed');result.textContent='Request received. Reference: '+x.requestId;}catch(err){result.textContent=err.message||'Unable to submit request.';}});</script></body></html>
